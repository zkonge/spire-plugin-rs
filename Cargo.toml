[package]
name = "spire-plugin"
version = "0.0.0"
authors = ["Konge <zkonge@outlook.com>"]
edition = "2021"

[dependencies]
prost = "0.14.1"
prost-types = "0.14.1"
tonic = { version = "0.14.2", default-features = false, features = ["codegen"] }
tonic-prost = "0.14.2"

[build-dependencies]
tonic-prost-build = "0.14.2"

[features]
default = [
    "agent-keymanager",
    "agent-nodeattestor",
    "agent-svidstore",
    "agent-workloadattestor",

    "server-bundlepublisher",
    "server-credentialcomposer",
    "server-keymanager",
    "server-nodeattestor",
    "server-notifier",
    "server-upstreamauthority",
]

agent-keymanager = []
agent-nodeattestor = []
agent-svidstore = []
agent-workloadattestor = []

server-bundlepublisher = []
server-credentialcomposer = []
server-keymanager = []
server-nodeattestor = []
server-notifier = []
server-upstreamauthority = []

[workspace]
resolver = "2"
members = ["examples/*"]

[workspace.dependencies]
tokio = { version = "1.48.0", features = ["rt"] }
futures-util = { version = "0.3.31", default-features = false }
pluginx = { git = "https://github.com/zkonge/pluginx.git" }
spire-plugin = { path = "." }
